<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hugo Silva - Backend Software Developer specializing in Java and Spring Boot">
    <meta name="author" content="Hugo Silva">
    <title>Hugo Silva | Backend Developer</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --navy: #1E3A5F;
            --teal: #2C9FAF;
            --light-teal: #E8F4F8;
            --dark-bg: #0A1628;
            --gradient-1: #1E3A5F;
            --gradient-2: #2C9FAF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--navy) 50%, var(--gradient-2) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--teal);
            border-radius: 50%;
            opacity: 0;
            animation: float 8s infinite;
        }
        
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 0.5s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 1.5s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 2.5s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 0.8s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 1.8s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 2.2s; }
        .particle:nth-child(10) { left: 95%; animation-delay: 1.2s; }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }
        
        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(44, 159, 175, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(44, 159, 175, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }
        
        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 1s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            color: var(--teal);
            margin-bottom: 60px;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.2s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .logo::before {
            content: '< ';
            color: var(--teal);
        }
        
        .logo::after {
            content: ' />';
            color: var(--teal);
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 0%, var(--teal) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.4s forwards;
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.6s forwards;
        }
        
        .tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--teal);
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.8s forwards;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(44, 159, 175, 0.3);
            padding: 20px 35px;
            border-radius: 50px;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--teal);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
        }
        
        .status-text {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
        }
        
        .contact-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(44, 159, 175, 0.2);
            padding: 35px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            opacity: 0;
            animation: fadeIn 1s ease-out 1.2s forwards;
            transition: all 0.3s ease;
        }
        
        .contact-card:hover {
            transform: translateY(-5px);
            border-color: rgba(44, 159, 175, 0.5);
            box-shadow: 0 20px 40px rgba(44, 159, 175, 0.2);
        }
        
        .contact-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        
        .email-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            color: var(--teal);
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .email-link:hover {
            color: #ffffff;
            transform: scale(1.05);
        }
        
        .tech-stack {
            margin-top: 50px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.4s forwards;
        }
        
        .tech-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        .tech-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 8px 18px;
            background: rgba(44, 159, 175, 0.1);
            border: 1px solid rgba(44, 159, 175, 0.3);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }
        
        .tech-tag:hover {
            background: rgba(44, 159, 175, 0.2);
            border-color: var(--teal);
            transform: translateY(-2px);
        }
        
        .footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            animation: fadeIn 1s ease-out 1.6s forwards;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .tagline {
                font-size: 0.9rem;
            }
            
            .email-link {
                font-size: 1rem;
            }
            
            .contact-card {
                padding: 25px;
            }
            
            .tech-tags {
                gap: 8px;
            }
            
            .tech-tag {
                font-size: 0.75rem;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="grid-overlay"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <!-- Main content -->
    <div class="container">
        <div class="logo">HUGOASILVA.DEV</div>
        
        <h1>Coming Soon</h1>
        
        <p class="subtitle">Backend Software Developer</p>
        
        <p class="tagline">Building scalable systems with Java & Spring Boot</p>
        
        <div class="status">
            <div class="status-dot"></div>
            <span class="status-text">Site Under Development</span>
        </div>
        
        <div class="contact-card">
            <div class="contact-label">Get in Touch</div>
            <a href="mailto:hugo@hugoasilva.dev" class="email-link">hugo@hugoasilva.dev</a>
        </div>
        
        <div class="tech-stack">
            <div class="tech-label">Core Technologies</div>
            <div class="tech-tags">
                <span class="tech-tag">Java</span>
                <span class="tech-tag">Spring Boot</span>
                <span class="tech-tag">MySQL</span>
                <span class="tech-tag">MongoDB</span>
                <span class="tech-tag">Redis</span>
                <span class="tech-tag">ActiveMQ</span>
            </div>
        </div>
    </div>
    
    <div class="footer">
        © 2026 Hugo Silva • Backend Developer
    </div>
</body>
</html>
